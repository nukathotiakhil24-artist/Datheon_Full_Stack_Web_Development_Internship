<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere - Product Catalog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#">ShopSphere</a>
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products" />
    <button id="cart-btn" class="cart-btn" type="button" aria-label="Open cart">
      <span aria-hidden="true">&#128722;</span>
      <span id="cart-count" class="count-badge">0</span>
    </button>
  </header>

  <section class="hero">
    <h1>Find something you love</h1>
    <p>Electronics, jewelry and clothing, all in one place.</p>
  </section>

  <main class="container">
    <div class="controls">
      <div id="filters" class="filters" role="group" aria-label="Filter by category">
        <button type="button" class="chip active" data-category="all">All</button>
        <button type="button" class="chip" data-category="electronics">Electronics</button>
        <button type="button" class="chip" data-category="jewelry">Jewelry</button>
        <button type="button" class="chip" data-category="clothing">Clothing</button>
      </div>
      <select id="sort" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>

    <p id="status" class="status" role="status"></p>
    <div id="product-grid" class="grid"></div>
  </main>

  <div id="overlay" class="overlay"></div>

  <aside id="cart-drawer" class="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-header">
      <h2>Your Cart</h2>
      <button id="close-cart" class="icon-btn" type="button" aria-label="Close cart">&#10005;</button>
    </div>
    <div id="cart-items" class="drawer-body"></div>
    <div class="drawer-footer">
      <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="row"><span>Tax (8%)</span><span id="tax">$0.00</span></div>
      <div class="row"><span>Shipping</span><span id="shipping">$0.00</span></div>
      <p id="shipping-note" class="note"></p>
      <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
      <button id="checkout-btn" class="btn btn-primary" type="button">Checkout</button>
    </div>
  </aside>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="check" aria-hidden="true">&#10003;</div>
      <h2 id="modal-title">Order confirmed!</h2>
      <p id="order-id" class="muted"></p>
      <p id="order-summary"></p>
      <button id="modal-close" class="btn btn-primary" type="button">Continue shopping</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
